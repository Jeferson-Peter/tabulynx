[project]
name = "tabulynx"
version = "0.1.0"
description = "Desktop spreadsheet-style viewer for CSV, XLSX, and Parquet files"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["desktop", "spreadsheet", "csv", "xlsx", "parquet", "polars", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "polars>=1.12.0",
    "openpyxl>=3.1.5",
    "fastexcel>=0.11.5",
    "PySide6>=6.8.0",
]

[project.urls]
Homepage = "https://github.com/Jeferson-Peter/tabulynx"
Repository = "https://github.com/Jeferson-Peter/tabulynx"
Issues = "https://github.com/Jeferson-Peter/tabulynx/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
tabulynx = "tabulynx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabulynx"]
